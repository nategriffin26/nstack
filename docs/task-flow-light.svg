<text class="detail" x="160" y="85" xml:space="preserve">one sitting goes straight to build</text>
<circle cx="46" cy="130" r="4.5" fill="#3c465c"/>
<text class="name" x="74" y="135">frame</text>
<text class="detail" x="160" y="135" xml:space="preserve">outcome · proof · keeps · facts · decisions</text>
