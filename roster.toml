# Generated from Context Models Settings, revision 3.

[roles.author]
title = "Default author"
does = "implementation, cross-file refactoring, frontend, product writing, review and synthesis"
agents = ["opus"]

[roles.systems]
title = "Hard systems work"
does = "complex debugging, concurrency, performance, invariants, security, large migrations, reverse engineering, computer and browser use"
agents = ["astra"]

[roles.taste]
title = "Taste-critical work"
does = "visual, motion, audio, UX and product direction"
agents = ["opus"]

[roles.implementer]
title = "Medium and easy tasks"
does = "bounded features, fixes, refactors, tests, scripts and debugging in a known area; hard, open-ended, taste-critical or one-way-door work goes to the default author or the hard systems agent"
agents = ["sonnet","sol"]

[roles.reader]
title = "Bulk reading"
does = "extraction and summarizing of large logs, corpora or codebases; sourced, compressed results"
agents = ["muse","gemini"]

[roles.research]
title = "Research lanes"
does = "one lane of skill://research each; retrieves through tf.py, writes a claim-ledger dossier at the assigned absolute path, returns a compact status"
agents = ["researcher"]

[roles.verify]
title = "Verification lanes"
does = "re-fetches the pages cited by specific skill://research claims and returns CONFIRMED, CONTESTED, REFUTED or UNKNOWN per claim"
agents = ["verifier"]

